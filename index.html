<script>
(function(){
 var btns=document.querySelectorAll('.lang button');
 function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-'+l+']').forEach(function(el){el.textContent=el.getAttribute('data-'+l)});
  btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l)});
  try{localStorage.setItem('lang',l)}catch(e){}
 }
 btns.forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang)})});
 var saved='en';
 try{saved=localStorage.getItem('lang')||((navigator.language||'').slice(0,2)==='es'?'es':'en')}catch(e){}
 setLang(saved);
})();
</script>
